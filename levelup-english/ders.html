<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ders — LevelUp English</title>
<style>
:root{
  --bg:#0a0f1e;--card:#121a2f;--card2:#172139;--line:#243150;--line2:#33436a;
  --text:#e8ecf6;--muted:#9aa6c2;--dim:#6c7997;
  --gold:#d8b25e;--gold2:#f2d68f;--goldInk:#1d1607;
  --ok:#45c48a;--bad:#f07272;--warn:#f0b34a;--info:#74b6ff;
  --r:16px;--shadow:0 14px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.55 "Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:radial-gradient(1100px 600px at 90% -10%,rgba(216,178,94,.08),transparent 60%),var(--bg)}
a{color:var(--gold2);text-decoration:none}
a:hover{text-decoration:underline}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid transparent;border-radius:12px;padding:.65rem 1.05rem;font-weight:650;transition:transform .12s,filter .15s,background .15s,border-color .15s;text-decoration:none!important;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--goldInk);box-shadow:0 6px 18px rgba(216,178,94,.2)}
.btn-gold:hover{filter:brightness(1.06)}
.btn-line{background:transparent;border-color:var(--line2);color:var(--text)}
.btn-line:hover{border-color:var(--gold);color:var(--gold2)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.sm{padding:.42rem .75rem;font-size:.86rem;border-radius:10px}

.top{position:sticky;top:0;z-index:20;background:rgba(10,15,30,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.05)}
.top .in{max-width:1100px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:1rem}
.logo{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.05rem;color:var(--text)!important;text-decoration:none!important;white-space:nowrap}
.logo b{color:var(--gold2)}
.crumb{color:var(--muted);font-size:.9rem;display:flex;gap:.4rem;align-items:center}
@media(max-width:700px){.crumb{display:none}}
.me{margin-left:auto;display:flex;align-items:center;gap:.6rem;font-size:.86rem}
.me .rk{color:var(--gold2);font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:20px}
.pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;font-weight:650;padding:.15rem .55rem;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.gold{color:var(--gold2);border-color:rgba(216,178,94,.45);background:rgba(216,178,94,.08)}
.pill.ok{color:#8fe3bb;border-color:rgba(69,196,138,.45);background:rgba(69,196,138,.08)}
.pill.bad{color:#ffb0b0;border-color:rgba(240,114,114,.45);background:rgba(240,114,114,.08)}
.muted{color:var(--muted)}

/* Ünite başlığı ve bölüm adımları */
.uhead{display:flex;justify-content:space-between;gap:1rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.uhead h1{margin:.3rem 0 .2rem;font-size:1.7rem;letter-spacing:-.3px}
.uhead p{margin:0;color:var(--muted)}
.uprog{min-width:220px}
.uprog .t{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);margin-bottom:.35rem}
.uprog .t b{color:var(--gold2)}
.bar{height:8px;border-radius:99px;background:#0b1224;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#b98b35,var(--gold2));transition:width .4s}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}
@media(max-width:860px){.steps{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.steps{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:thin}.steps .st{flex:0 0 128px;scroll-snap-align:start}}
.st{display:flex;flex-direction:column;gap:.25rem;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#0b1224;color:var(--muted)!important;text-decoration:none!important;font-size:.84rem;position:relative}
.st .n{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--dim)}
.st b{color:var(--text);font-size:.9rem}
.st:hover{border-color:var(--line2)}
.st.cur{border-color:rgba(216,178,94,.65);box-shadow:0 0 0 3px rgba(216,178,94,.1)}
.st.done .n{color:var(--ok)}
.st.lock{opacity:.45;cursor:not-allowed}
.st.lock b{color:var(--muted)}

/* Kelime kartları */
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{margin:0;font-size:1.2rem;display:flex;align-items:center;gap:.5rem}
.sec-head h2 svg{color:var(--gold2)}
.sec-head p{margin:.2rem 0 0;color:var(--muted);font-size:.92rem}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:980px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.cards{grid-template-columns:1fr}}
.fc{display:block;width:100%;perspective:900px;height:178px;background:none;border:0;padding:0;text-align:left;color:inherit}
.fc .inner{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;border:1px solid var(--line);background:linear-gradient(180deg,#172139,#0f1730)}
.fc .back{transform:rotateY(180deg);background:linear-gradient(180deg,#221c0e,#141024);border-color:rgba(216,178,94,.45)}
.fc:hover .front{border-color:var(--line2)}
.fc .no{font-size:.72rem;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.fc .en{font-size:1.3rem;font-weight:750;margin:.35rem 0 .3rem;color:var(--text)}
.fc .tr{font-size:1.2rem;font-weight:750;margin:.35rem 0 .3rem;color:var(--gold2)}
.fc .ex{font-size:.83rem;color:var(--muted);font-style:italic;margin-top:auto}
.fc .hint{font-size:.72rem;color:var(--dim);margin-top:.35rem}
.fc.seen .front{border-color:rgba(69,196,138,.35)}
.pips{display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:#26314f}
.pips i.on{background:var(--ok)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:16px}
.note{display:flex;gap:.6rem;align-items:flex-start;padding:.8rem .9rem;border-radius:12px;background:rgba(116,182,255,.07);border:1px solid rgba(116,182,255,.25);font-size:.88rem;color:var(--muted);margin-bottom:14px}
.note svg{color:var(--info);margin-top:.15rem}
.note b{color:var(--text)}

/* Alıştırma */
.quiz{max-width:680px;margin:0 auto}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;color:var(--muted);margin-bottom:.5rem}
.qcard{padding:26px;margin-top:14px}
.qask{color:var(--muted);font-size:.9rem;margin:0}
.qword{font-size:2rem;font-weight:800;margin:.3rem 0 1.1rem;letter-spacing:-.3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:.7rem;align-items:center;padding:.85rem 1rem;border-radius:12px;border:1.5px solid var(--line);background:#0b1224;text-align:left;font-weight:600;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--line2)}
.opt .k{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:.75rem;color:var(--dim);flex:none}
.opt.good{border-color:var(--ok);background:rgba(69,196,138,.1)}
.opt.bad{border-color:var(--bad);background:rgba(240,114,114,.1)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;padding:14px;border-radius:12px;display:flex;gap:.7rem;align-items:flex-start}
.fb.good{background:rgba(69,196,138,.08);border:1px solid rgba(69,196,138,.35)}
.fb.bad{background:rgba(240,114,114,.08);border:1px solid rgba(240,114,114,.35)}
.fb .fi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.fb.good .fi{background:rgba(69,196,138,.2);color:var(--ok)}
.fb.bad .fi{background:rgba(240,114,114,.2);color:var(--bad)}
.fb b{display:block}
.fb small{display:block;color:var(--muted);margin-top:.2rem}
.fb .cnt{color:var(--gold2);font-size:.8rem;margin-top:.3rem}
.qnav{display:flex;justify-content:flex-end;margin-top:16px}

/* Sonuç */
.result{max-width:720px;margin:0 auto;text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--gold2);line-height:1}
.score small{font-size:1.2rem;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.rgrid div{padding:12px;border-radius:12px;background:#0b1224;border:1px solid var(--line)}
.rgrid b{display:block;font-size:1.3rem;color:var(--gold2)}
.rgrid span{font-size:.8rem;color:var(--muted)}
.wrong{text-align:left;margin-top:14px;padding:16px;border-radius:14px;background:#0b1224;border:1px solid rgba(240,114,114,.35)}
.wrong h3{margin:0 0 .2rem;font-size:1rem}
.wrong p{margin:0 0 .7rem;color:var(--muted);font-size:.88rem}
.wl{display:grid;gap:6px}
.wl label{display:flex;gap:.7rem;align-items:center;padding:.55rem .7rem;border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer}
.wl input{width:17px;height:17px;accent-color:var(--gold)}
.wl .tr{color:var(--muted);margin-left:auto;font-size:.88rem}
.wl .in{color:var(--dim);font-size:.78rem}
.racts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.wordprog{text-align:left;margin-top:16px}
.wordprog .row{display:flex;justify-content:space-between;align-items:center;padding:.45rem .2rem;border-top:1px solid rgba(255,255,255,.05);font-size:.9rem}
.wordprog .row:first-child{border-top:0}

/* Cümleler: okuma listesi */
.sents{display:grid;gap:10px}
.sent{padding:14px 16px;border-radius:12px;background:#0b1224;border:1px solid var(--line)}
.sent .line{font-size:1.08rem;line-height:1.9}
.tok{background:none;border:0;padding:0 .08rem;border-radius:5px;color:var(--text);font-size:inherit;border-bottom:1px dashed rgba(255,255,255,.18)}
.tok:hover,.tok.on{background:rgba(116,182,255,.15)}
.tok.hl{color:var(--gold2);font-weight:700;border-bottom-color:rgba(216,178,94,.6)}
.tok.hl:hover,.tok.hl.on{background:rgba(216,178,94,.15)}
.sent .gl{font-size:.86rem;color:var(--info);min-height:1.3em;margin-top:.15rem}
.sent .gl b{color:var(--text)}
.sent .tr{font-size:.86rem;color:var(--muted);margin-top:.25rem}
.sent .row{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.linkbtn{background:none;border:0;padding:0;color:var(--gold2);font-weight:600;font-size:.84rem}
/* Yazmalı soru */
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--gold);margin:0 .2rem;color:var(--gold2)}
.qsent{font-size:1.45rem;font-weight:700;margin:.35rem 0 .4rem;line-height:1.5}
.qhint{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
.qhint b{color:var(--gold2)}
.typed{display:flex;gap:8px}
.typed input{flex:1;background:#0b1224;border:1.5px solid var(--line);border-radius:12px;padding:.8rem .95rem;outline:none;font-size:1.05rem}
.typed input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(216,178,94,.13)}
.typed input.good{border-color:var(--ok)}
.typed input.bad{border-color:var(--bad)}
.opts.three{grid-template-columns:1fr}
/* Dil bilgisi anlatımı */
.lesson{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.lesson{grid-template-columns:1fr}}
.rule{padding:16px;border-radius:14px;background:#0b1224;border:1px solid var(--line)}
.rule h3{margin:0 0 .5rem;font-size:1rem;display:flex;gap:.45rem;align-items:center}
.rule h3 .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(216,178,94,.15);color:var(--gold2);font-size:.75rem}
.rule p{margin:.2rem 0 .6rem;color:var(--muted);font-size:.9rem}
.rule table{width:100%;border-collapse:collapse;font-size:.9rem}
.rule td{padding:.4rem .3rem;border-top:1px solid rgba(255,255,255,.05);vertical-align:top}
.rule td:first-child{color:var(--muted);width:42%}
.rule em{font-style:normal;color:var(--gold2);font-weight:700}
.rule.wide{grid-column:1/-1}
.freq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.freq{grid-template-columns:1fr 1fr}}
.freq div{padding:10px;border-radius:10px;background:rgba(255,255,255,.03);text-align:center}
.freq b{display:block;color:var(--gold2)}
.freq span{font-size:.8rem;color:var(--muted)}
.freq i{display:block;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--gold2));margin:.4rem auto 0}

/* Okuma ve anlama */
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.textpanel{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
@media(max-width:900px){.textpanel{position:static;max-height:none}}
.split .quiz{max-width:none;margin:0}
.reader h3{margin:0 0 .15rem;font-size:1.3rem}
.reader .by{color:var(--dim);font-size:.8rem;margin-bottom:.8rem}
.reader p{font-size:1.07rem;line-height:2.05;margin:0 0 .9rem}
.reader .tok{border-bottom-color:transparent}
.reader .tok:hover{border-bottom-color:rgba(255,255,255,.25)}
.snt{border-radius:6px;transition:background .3s,box-shadow .3s}
.snt.ev{background:rgba(116,182,255,.3);box-shadow:0 0 0 3px rgba(116,182,255,.3);animation:evpulse 1.2s ease 1}
.snt.ev .tok{color:#e3f0ff}
@keyframes evpulse{0%{background:rgba(116,182,255,.65)}100%{background:rgba(116,182,255,.3)}}
.ph.found .tok{color:var(--gold2);font-weight:700;border-bottom:1px solid rgba(216,178,94,.6)}
.glossbar{position:sticky;top:0;z-index:2;padding:.6rem .8rem;border-radius:10px;background:#0b1224;border:1px solid var(--line);font-size:.9rem;color:var(--muted);margin-bottom:.9rem;min-height:2.7em;display:flex;flex-wrap:wrap;gap:.3rem .4rem;align-items:center}
.glossbar b{color:var(--text)}
.glossbar .u{color:var(--gold2);font-weight:700}
.hunt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:.8rem}
@media(max-width:520px){.hunt{grid-template-columns:1fr}}
.hunt div{display:flex;justify-content:space-between;align-items:center;gap:.4rem;padding:.45rem .65rem;border-radius:9px;background:rgba(255,255,255,.03);font-size:.86rem;color:var(--muted)}
.hunt div.ok{color:var(--text);background:rgba(69,196,138,.08)}
.hunt div.ok b{color:var(--gold2)}
.hunt div.ok svg{color:var(--ok)}
.trbox{margin-top:14px;padding:14px 16px;border-radius:12px;background:#0b1224;border:1px solid var(--line);font-size:.92rem;color:var(--muted)}
.trbox b svg{color:var(--gold2);vertical-align:-2px}
.trbox p{margin:.6rem 0 0;line-height:1.7}
.lockline{display:flex;gap:.5rem;align-items:center;color:var(--dim);font-size:.88rem}
details.mtxt{margin:-.3rem 0 1rem;border:1px solid var(--line);border-radius:10px;background:#0b1224}
details.mtxt summary{cursor:pointer;padding:.55rem .8rem;color:var(--gold2);font-weight:600;font-size:.88rem}
details.mtxt .reader{padding:0 .9rem .4rem}
details.mtxt .reader p{font-size:.95rem;line-height:1.85}
.qsent.trq{font-style:italic;color:var(--gold2)}
.intro{display:grid;gap:10px;margin:4px 0}
.intro > div{display:flex;gap:.7rem;align-items:flex-start;padding:.75rem .9rem;border-radius:12px;background:#0b1224;border:1px solid var(--line);font-size:.92rem;color:var(--muted)}
.intro b{color:var(--text);display:block}
.intro svg{color:var(--gold2);margin-top:.2rem}
/* Kelime sıralama */
.order .ans{min-height:58px;padding:10px;border-radius:12px;border:1.5px dashed var(--line2);background:#0b1224;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.order .ans:empty::before{content:'Parçalara sırayla tıkla…';color:var(--dim);font-size:.9rem}
.order .pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:44px}
.chipw{padding:.5rem .85rem;border-radius:10px;border:1.5px solid var(--line2);background:var(--card2);font-weight:650;font-size:1rem;color:var(--text);transition:transform .12s,border-color .12s}
.chipw:hover:not([disabled]){border-color:var(--gold);transform:translateY(-1px)}
.chipw[disabled]{cursor:default}
.order.good .ans{border-color:var(--ok);border-style:solid}
.order.bad .ans{border-color:var(--bad);border-style:solid}
.oacts{display:flex;justify-content:space-between;gap:8px}
/* Yanlış çeviride fark */
.diff{margin-top:.4rem;font-size:.9rem;line-height:1.8;color:var(--muted)}
.diff del{color:#ffb0b0;text-decoration:line-through;background:rgba(240,114,114,.12);border-radius:4px;padding:0 .15rem}
.diff ins{color:#8fe3bb;text-decoration:none;background:rgba(69,196,138,.14);border-radius:4px;padding:0 .15rem;font-weight:700}
/* Ünite testi sonucu */
.rgrid.four{grid-template-columns:repeat(4,1fr)}
@media(max-width:560px){.rgrid.four{grid-template-columns:1fr 1fr}}
.rgrid .weakcell{border-color:rgba(240,179,74,.5)}
.rgrid .weakcell b{color:var(--warn)}
.unitdone{margin-top:16px;padding:22px;border-radius:16px;text-align:center;background:radial-gradient(400px 200px at 50% 0%,rgba(216,178,94,.18),transparent),#0b1224;border:1px solid rgba(216,178,94,.5)}
.unitdone h3{margin:.3rem 0;color:var(--gold2);font-size:1.45rem}
.weak{margin-top:14px;text-align:left;padding:16px;border-radius:14px;background:#0b1224;border:1px solid rgba(240,179,74,.4)}
.weak h3{margin:0 0 .4rem;font-size:1rem;display:flex;gap:.4rem;align-items:center}
.weak h3 svg{color:var(--warn)}
.weak a{margin:.25rem .3rem 0 0}

/* Yakında bölümleri */
.soon{text-align:center;padding:48px 20px}
.soon .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;margin:0 auto 12px;background:rgba(216,178,94,.1);border:1px solid rgba(216,178,94,.3);color:var(--gold2)}
.soon .ic svg{width:28px;height:28px}
.soon h2{margin:0 0 .3rem}
.soon p{color:var(--muted);margin:0 auto;max-width:460px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1b2541;border:1px solid var(--line2);color:var(--text);padding:.7rem 1rem;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:100;display:flex;gap:.5rem;align-items:center;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok svg{color:var(--ok)}.toast.bad svg{color:var(--bad)}.toast.gold svg{color:var(--gold2)}
.levelup{position:fixed;inset:0;background:rgba(5,8,18,.9);display:grid;place-items:center;z-index:95;opacity:0;pointer-events:none;transition:opacity .3s}
.levelup.show{opacity:1;pointer-events:auto}
.levelup .in{text-align:center;transform:scale(.7);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.levelup.show .in{transform:scale(1)}
.levelup h3{font-size:1.7rem;margin:.6rem 0 .2rem;color:var(--gold2)}
.levelup p{color:var(--muted);margin:0 0 1.2rem}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shake{animation:shake .35s}

function cyrb53(str, seed = 0){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

let P = (() => { try{ return JSON.parse(localStorage.getItem(PKEY)); }catch(e){ return null; } })() || {};
P = Object.assign({ rank:0, tier:3, xp:0, toplamXp:0, seri:0, sonCalisma:null, ogrenilen:[], bilemedigi:[], kutuphane:[], hataKutuphanesi:[],
  beceri:{ kelime:{d:0,t:0}, dilbilgisi:{d:0,t:0}, okuma:{d:0,t:0}, ceviri:{d:0,t:0} }, uniteler:[], sinavlar:[], basarimlar:[], gunluk:null, hareketler:[],
  sayac:{ gorev:0, tamGun:0, hatadanOgrenilen:0 } }, P);
P.kelimeler = P.kelimeler || {};     // kelime bazında doğru/yanlış kaydı
P.uniteDurum = P.uniteDurum || {};   // ünite ve bölüm durumu
const UD = P.uniteDurum[UID] = P.uniteDurum[UID] || { basla:Date.now(), bolumler:{}, goruldu:[] };
if(U){ UD.ad = U.ad; UD.seviye = U.seviye; } // gelişim raporunda ünite adını göstermek için
function saveP(){ localStorage.setItem(PKEY, JSON.stringify(P)); }
function log(m){ P.hareketler.unshift({ t:Date.now(), m }); P.hareketler = P.hareketler.slice(0, 40); }
/* Günlük istatistik (gelişim raporundaki grafik için): { 'YYYY-AA-GG': { xp, d, t } } */
function dayStat(){
  P.gunlukIst = P.gunlukIst || {};
  const t = today(), o = P.gunlukIst[t] = P.gunlukIst[t] || { xp:0, d:0, t:0 };
  const keys = Object.keys(P.gunlukIst).sort(); while(keys.length > 60) delete P.gunlukIst[keys.shift()];
  return o;
}
function markStudy(){
  const t = today(); if(P.sonCalisma === t) return;
  P.seri = P.sonCalisma && daysBetween(P.sonCalisma, t) === 1 ? P.seri + 1 : 1; P.sonCalisma = t;
}
function addXp(n, why){
  if(n <= 0) return;
  const before = rankName(P), need = XP_TIER[P.rank];
  P.toplamXp += n; P.xp += n; dayStat().xp += n;
  let up = false;
  while(P.tier > 1 && P.xp >= need){ P.xp -= need; P.tier--; up = true; }
  if(P.tier === 1 && P.xp > need) P.xp = need;
  log(`+${n} XP · ${why}`);
  if(up){
    log(`Kademe atlandı: ${before} → ${rankName(P)}`);
    $('#luEm').innerHTML = emblem(P.rank, 130, P.tier); $('#luTitle').textContent = rankName(P) + ' oldun!';
    $('#luSub').textContent = P.tier === 1 ? 'Bu kademede XP dolunca rütbe sınavı açılacak.' : 'Rütbende bir kademe yükseldin.';
    $('#levelup').classList.add('show');
  }
}
$('#luOk').addEventListener('click', () => $('#levelup').classList.remove('show'));

/* Günlük görevler (dashboard ile aynı mantık) */
const TASK_POOL = { ekle:{ hedef:3, xp:15, ad:'Kelime kütüphanene 3 kelime ekle' }, kelime:{ hedef:5, xp:20, ad:'Bir üniteden 5 yeni kelime öğren' }, okuma:{ hedef:1, xp:25, ad:'1 okuma metni tamamla' }, tekrar:{ hedef:3, xp:20, ad:'Hata kütüphanesinden 3 kelimeyi öğren' }, test:{ hedef:1, xp:15, ad:'1 alıştırma testi çöz' } };
function ensureDaily(){
  const t = today(); if(P.gunluk && P.gunluk.tarih === t) return;
  const rest = ['kelime','okuma','tekrar','test'], seed = parseInt(cyrb53(t + me.id).slice(-6), 16);
  const a = rest[seed % 4], b = rest[(seed + 1 + (seed >> 3) % 3) % 4];
  P.gunluk = { tarih:t, gorevler:['ekle', a, b].map(id => ({ id, ilerleme:0, tamam:false })) };
}
function taskProgress(id, n = 1){
  ensureDaily();
  const g = P.gunluk.gorevler.find(x => x.id === id);
  if(!g || g.tamam) return;
  g.ilerleme = Math.min(TASK_POOL[id].hedef, g.ilerleme + n);
  if(g.ilerleme >= TASK_POOL[id].hedef){
    g.tamam = true; P.sayac.gorev++;
    setTimeout(() => toast(`Günlük görev tamamlandı: +${TASK_POOL[id].xp} XP`, 'gold'), 600);
    addXp(TASK_POOL[id].xp, 'Günlük görev: ' + TASK_POOL[id].ad);
    if(P.gunluk.gorevler.every(x => x.tamam)){ P.sayac.tamGun++; log('Bugünün tüm görevleri tamamlandı'); }
  }
}

/* Kelime öğrenme kuralı: 3 doğru, her biri farklı bölümde ve en az 10 dk arayla */
function wordRec(w){ return P.kelimeler[UID + ':' + w.id] = P.kelimeler[UID + ':' + w.id] || { en:w.en, tr:w.tr, dogru:[], yanlis:0, sonYanlis:null }; }
function learnedCount(w){ return Math.min(LEARN_COUNT, (P.kelimeler[UID + ':' + w.id]?.dogru || []).length); }
function pips(w){ const n = learnedCount(w); return `<span class="pips" title="Öğrenme: ${n}/${LEARN_COUNT}">${[0,1,2].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`; }
/* Döner: { sayildi, ogrenildi, neden } */
function recordAnswer(w, ok, bolum, beceri){
  P.beceri[beceri].t++; if(ok) P.beceri[beceri].d++;
  const ds = dayStat(); ds.t++; if(ok) ds.d++;
  const r = wordRec(w);
  if(!ok){ r.yanlis++; r.sonYanlis = Date.now(); return { sayildi:false }; }
  if(r.dogru.length >= LEARN_COUNT) return { sayildi:false, neden:'zaten' };
  if(r.dogru.some(d => d.b === bolum)) return { sayildi:false, neden:'bolum' };
  const last = r.dogru[r.dogru.length - 1];
  if(last && Date.now() - last.t < LEARN_GAP) return { sayildi:false, neden:'sure', kalan:Math.ceil((LEARN_GAP - (Date.now() - last.t)) / 60000) };
  r.dogru.push({ t:Date.now(), b:bolum });
  if(r.dogru.length === 1) taskProgress('kelime');
  let ogrenildi = false;
  if(r.dogru.length === LEARN_COUNT){
    ogrenildi = true;
    if(!P.ogrenilen.includes(w.en)) P.ogrenilen.push(w.en);
    log('Kelime öğrenildi: ' + w.en);
  }
  return { sayildi:true, ogrenildi };
}

/* ================= Bölüm kilitleri ================= */
const secDone = id => !!(UD.bolumler[id] && UD.bolumler[id].tamam);
function secOpen(i){
  const s = SECTIONS[i];
  if(i === 0 || s.herZamanAcik || secDone(s.id)) return true;
  // Ünite testi için dil bilgisi dahil bütün bölümler; diğerleri için "her zaman açık" olmayan önceki bölümler
  const need = s.hepsiGerekli ? SECTIONS.slice(0, i) : SECTIONS.slice(0, i).filter(x => !x.herZamanAcik);
  return need.every(x => secDone(x.id));
}
function firstOpenUndone(){
  let i = SECTIONS.findIndex((s, i) => secOpen(i) && !secDone(s.id) && !s.herZamanAcik);
  if(i < 0) i = SECTIONS.findIndex((s, i) => secOpen(i) && !secDone(s.id));
  return i < 0 ? 0 : i;
}
function nextSection(idx){
  let i = SECTIONS.findIndex((s, i) => i > idx && secOpen(i) && !secDone(s.id));
  if(i < 0) i = SECTIONS.findIndex((s, i) => secOpen(i) && !secDone(s.id));
  return i;
}

/* ================= Çerçeve ================= */
function renderFrame(cur){
  $('#me').innerHTML = `${emblem(P.rank, 30, P.tier)}<span><span class="rk">${esc(rankName(P))}</span><br><span class="muted">${P.xp} / ${XP_TIER[P.rank]} XP</span></span>`;
  $('#crumbUnit').textContent = U.ad;
  $('#uLevel').textContent = U.seviye + ' · ' + U.ing;
  $('#uTitle').textContent = U.ad;
  $('#uDesc').textContent = U.aciklama;
  const done = SECTIONS.filter(s => secDone(s.id)).length;
  $('#uDone').textContent = done; $('#uBar').style.width = done / 7 * 100 + '%';
  $('#steps').innerHTML = SECTIONS.map((s, i) => {
    const open = secOpen(i), d = secDone(s.id);
    return `<a class="st ${i === cur ? 'cur' : ''} ${d ? 'done' : ''} ${open ? '' : 'lock'}" href="${open ? '#' + s.id : '#'}" data-i="${i}" ${open ? '' : 'aria-disabled="true"'}>
      <span class="n">${ic(d ? 'check' : open ? s.ikon : 'lock')} ${i + 1}. bölüm</span><b>${s.ad}</b></a>`;
  }).join('');
  const curEl = $('#steps .st.cur');
  if(curEl && $('#steps').scrollWidth > $('#steps').clientWidth) $('#steps').scrollLeft = curEl.offsetLeft - 20; // mobilde etkin bölümü görünür yap
}
$('#steps').addEventListener('click', e => {
  const a = e.target.closest('.st'); if(!a) return;
  if(a.classList.contains('lock')){ e.preventDefault(); toast('Bu bölüm, önceki bölümleri tamamlayınca açılır.', 'bad'); }
});
function route(){
  const id = location.hash.slice(1);
  let i = SECTIONS.findIndex(s => s.id === id);
  if(i < 0 || !secOpen(i)) i = firstOpenUndone();
  renderFrame(i);
  const v = $('#view'); v.classList.remove('fade'); void v.offsetWidth; v.classList.add('fade');
  (VIEWS[SECTIONS[i].id] || soon)(SECTIONS[i]);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ================= 1. bölüm: Kelimeler ================= */
let quiz = null;
function viewKelime(){
  const v = $('#view'), seen = new Set(UD.goruldu), all = seen.size >= U.kelimeler.length;
  v.innerHTML = `
    <div class="sec-head"><div><h2>${ic('book')} Kelimeler</h2><p>Kartın üstüne tıkla, Türkçesini ve örnek cümlenin çevirisini gör.</p></div>

          <span class="face back"><span class="no"><span>${esc(w.en)}</span>${pips(w)}</span><span class="tr">${esc(w.tr)}</span><span class="ex">${esc(w.ornekTr)}</span><span class="hint">Geri çevirmek için tıkla</span></span>

function startQuiz(){
  const words = shuffle(U.kelimeler.slice());
  quiz = { i:0, sonuc:[], xp:0, sayilan:0, ogrenilen:[],
    sorular: words.map((w, i) => {
      const dir = i % 2 ? 'tr2en' : 'en2tr', others = shuffle(U.kelimeler.filter(x => x !== w)).slice(0, 3);
      return { w, dir, opts:shuffle([w, ...others]) };
    }) };
  renderQ();
}
function renderQ(){
  const q = quiz.sorular[quiz.i], n = quiz.sorular.length, en2tr = q.dir === 'en2tr';
  $('#view').innerHTML = `
    <div class="quiz">
      <div class="qtop"><span>Kelime alıştırması</span><span>Soru <b>${quiz.i + 1}</b> / ${n}</span></div>
      <div class="bar"><i style="width:${quiz.i / n * 100}%"></i></div>
      <div class="card qcard">
        <p class="qask">${en2tr ? 'Bu ifadenin Türkçesi hangisi?' : 'Bu ifadenin İngilizcesi hangisi?'}</p>
        <div class="qword">${esc(en2tr ? q.w.en : q.w.tr)}</div>
        <div class="opts" id="opts">${q.opts.map((o, k) => `<button type="button" class="opt" data-id="${o.id}"><span class="k">${k + 1}</span>${esc(en2tr ? o.tr : o.en)}</button>`).join('')}</div>
        <div id="fb"></div>
        <div class="qnav"><button class="btn btn-gold" type="button" id="nextQ" hidden>${quiz.i + 1 < n ? 'Sonraki soru' : 'Sonucu gör'} ${ic('arrow')}</button></div>
      </div>
      <p class="muted" style="text-align:center;font-size:.82rem;margin-top:10px">İpucu: Klavyeden 1–4 ile seçip Enter ile ilerleyebilirsin.</p>
    </div>`;
  $('#opts').addEventListener('click', e => { const b = e.target.closest('.opt'); if(b && !b.disabled) answer(b.dataset.id); });
  $('#nextQ').addEventListener('click', nextQ);
}
function answer(id){
  const q = quiz.sorular[quiz.i], ok = id === q.w.id;
  $$('#opts .opt').forEach(b => { b.disabled = true; if(b.dataset.id === q.w.id) b.classList.add('good'); else if(b.dataset.id === id) b.classList.add('bad'); });
  const r = recordAnswer(q.w, ok, 'kelime', 'kelime');
  quiz.sonuc.push({ w:q.w, ok });
  let extra = '';
  if(ok && r.sayildi){ quiz.xp += 5; quiz.sayilan++; extra = `Öğrenme: ${learnedCount(q.w)}/${LEARN_COUNT} · +5 XP`; if(r.ogrenildi){ quiz.ogrenilen.push(q.w); extra += ' · Kelime öğrenildi!'; } }
  else if(ok && r.neden === 'bolum') extra = 'Bu kelime bu bölümde zaten sayıldı; sonraki bölümlerde tekrar doğru bilirsen ilerler.';
  else if(ok && r.neden === 'sure') extra = `Son doğru cevabından bu yana 10 dakika geçmedi (${r.kalan} dk kaldı); bu cevap öğrenmeye sayılmadı.`;
  else if(ok && r.neden === 'zaten') extra = 'Bu kelimeyi zaten öğrendin.';
  $('#fb').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><span class="fi">${ic(ok ? 'check' : 'x')}</span><div>
    <b>${ok ? 'Doğru!' : 'Yanlış. Doğru cevap: ' + esc(q.dir === 'en2tr' ? q.w.tr : q.w.en)}</b>
    <small><i>${esc(q.w.ornek)}</i> — ${esc(q.w.ornekTr)}</small>${extra ? `<div class="cnt">${esc(extra)}</div>` : ''}</div></div>`;
  if(!ok) $('#fb .fb').classList.add('shake');
  markStudy(); saveP();
  $('#nextQ').hidden = false; $('#nextQ').focus();
}
function nextQ(){ quiz.i++; if(quiz.i < quiz.sorular.length) renderQ(); else finishQuiz(); }
document.addEventListener('keydown', e => {
  if(!quiz || !$('#opts')) return;
  if(/^[1-4]$/.test(e.key)){ const b = $$('#opts .opt')[+e.key - 1]; if(b && !b.disabled) b.click(); }
});

function finishQuiz(){
  const n = quiz.sorular.length, d = quiz.sonuc.filter(s => s.ok).length, pct = d / n, passed = pct >= PASS;
  const prev = UD.bolumler.kelime || { tamam:false, enIyi:0, deneme:0 };
  const firstPass = passed && !prev.tamam;
  UD.bolumler.kelime = { tamam: prev.tamam || passed, enIyi: Math.max(prev.enIyi || 0, Math.round(pct * 100)), deneme:(prev.deneme || 0) + 1, t:Date.now() };
  taskProgress('test');
  let bonus = 0;
  if(firstPass){ bonus = 20; log(`${U.ad} · Kelimeler bölümü tamamlandı`); }
  log(`${U.ad} · Kelime alıştırması: ${d}/${n}`);
  addXp(quiz.xp + bonus, `${U.ad} · kelime alıştırması`);
  saveP();
  const wrong = quiz.sonuc.filter(s => !s.ok).map(s => s.w).filter((w, i, a) => a.indexOf(w) === i);
  const inErr = w => P.hataKutuphanesi.some(h => h.en.toLowerCase() === w.en.toLowerCase());

  $('#view').innerHTML = `
    <div class="result">
      <div style="display:flex;justify-content:center">${emblem(P.rank, 80, P.tier)}</div>

      <div class="score">${d}<small> / ${n}</small></div>
      <div class="rgrid">
        <div><b>%${Math.round(pct * 100)}</b><span>Başarı</span></div>
        <div><b>+${quiz.xp + bonus}</b><span>XP${bonus ? ' (20 bölüm bonusu dahil)' : ''}</span></div>
        <div><b>${quiz.sayilan}</b><span>Öğrenmeye sayılan cevap</span></div>
      </div>
      ${quiz.ogrenilen.length ? `<p class="pill ok" style="font-size:.85rem">Öğrenilen: ${quiz.ogrenilen.map(w => esc(w.en)).join(', ')}</p>` : ''}
      ${wrong.length ? `
        <div class="wrong">
          <h3>Zorlandığın kelimeler (${wrong.length})</h3>
          <p>Bu kelimeleri hata kütüphanene eklemek ister misin? Eklediklerini daha sonra panelinden tekrar edebilirsin.</p>
          <div class="wl" id="wl">${wrong.map(w => `<label><input type="checkbox" value="${w.id}" ${inErr(w) ? 'disabled' : 'checked'}><b>${esc(w.en)}</b>${inErr(w) ? '<span class="in">zaten hata kütüphanende</span>' : ''}<span class="tr">${esc(w.tr)}</span></label>`).join('')}</div>
          <div class="racts" style="justify-content:flex-start;margin-top:12px">
            <button class="btn btn-gold sm" type="button" id="addErr">${ic('bug')} Seçilenleri ekle</button>
            <button class="btn btn-ghost sm" type="button" id="noErr">Hayır, teşekkürler</button>
          </div>
        </div>` : '<p class="pill ok" style="font-size:.85rem;margin-top:8px">Hiç yanlışın yok, harika!</p>'}
      <div class="wordprog card pad" style="margin-top:16px">
        <b>Kelimelerin öğrenme durumu</b>
        ${U.kelimeler.map(w => `<div class="row"><span>${esc(w.en)} <span class="muted">— ${esc(w.tr)}</span></span><span style="display:flex;gap:.5rem;align-items:center">${(P.kelimeler[UID + ':' + w.id]?.yanlis || 0) ? `<span class="pill bad">${P.kelimeler[UID + ':' + w.id].yanlis} yanlış</span>` : ''}${pips(w)}</span></div>`).join('')}
      </div>
      <div class="racts">
        <button class="btn btn-line" type="button" id="again">${ic('refresh')} Tekrar dene</button>
        <a class="btn btn-ghost" href="#kelime" id="toCards">Kartlara dön</a>
        ${secOpen(1) ? `<a class="btn btn-gold" href="#cumle">Sonraki bölüm: Cümleler ${ic('arrow')}</a>` : ''}
      </div>
    </div>`;
  quiz = null;
  $('#again').addEventListener('click', startQuiz);
  $('#toCards').addEventListener('click', e => { e.preventDefault(); history.replaceState(null, '', '#kelime'); route(); });
  if(wrong.length){
    const box = $('.wrong');
    $('#addErr').addEventListener('click', () => {
      const ids = $$('#wl input:checked:not(:disabled)').map(x => x.value);
      if(!ids.length){ toast('Eklemek için en az bir kelime seç.', 'bad'); return; }
      ids.forEach(id => {
        const w = U.kelimeler.find(x => x.id === id);
        P.hataKutuphanesi.push({ id:'h' + rnd(8), en:w.en, tr:w.tr, not:`${U.seviye} · ${U.ad} · kelime alıştırması`, t:Date.now() });
        if(!P.bilemedigi.includes(w.en.toLowerCase())) P.bilemedigi.push(w.en.toLowerCase());
      });
      log(`Hata kütüphanesine ${ids.length} kelime eklendi`); saveP();
      box.innerHTML = `<h3>${ic('check')} ${ids.length} kelime hata kütüphanene eklendi</h3><p style="margin:0">Panelindeki <a href="dashboard.html#kutuphane?hata">Hata kütüphanesi</a> bölümünden tekrar edebilirsin.</p>`;
    });
    $('#noErr').addEventListener('click', () => { box.innerHTML = '<p style="margin:0">Tamam, hiçbir kelime eklenmedi. Yanlışların yine de kelime durumunda kayıtlı.</p>'; });
  }
}

/* ================= Henüz hazır olmayan bölümler ================= */
function soon(s){
  $('#view').innerHTML = `<div class="soon"><div class="ic">${ic(s.ikon)}</div><h2>${s.ad}</h2><p>Bu bölüm bir sonraki geliştirme adımında eklenecek. Şimdilik <a href="#kelime">Kelimeler</a> bölümünü çalışabilirsin.</p></div>`;
}
/* ================= Ortak alıştırma motoru =================
   Soru tipleri: 'secim' (şıklı), 'yaz' (yazmalı), 'sirala' (kelime sıralama).
   Soru alanları: ust, soru (HTML), ipucu / gizliIpucu (HTML), secenekler, karisik (sıralama parçaları), dogru:[kabul edilen cevaplar],
   w (ünite kelimesi), beceri, aciklama, tr, tam (tam cümle), kanit (okuma metninde cevabın geçtiği cümle), metinGoster, diff */
let run = null;
const norm = s => String(s).toLowerCase().replace(/[’`´']/g, '').replace(/[.!?,;:"“”]/g, '').replace(/\s+/g, ' ').trim();
const toks = s => norm(s).split(' ').filter(Boolean);
/* İki kelime dizisinin en uzun ortak alt dizisi: hangi kelimeler eşleşti? */
function lcsMatch(a, b){
  const m = a.length, n = b.length, dp = Array.from({ length:m + 1 }, () => new Array(n + 1).fill(0));
  for(let i = m - 1; i >= 0; i--) for(let j = n - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ma = new Array(m).fill(false), mb = new Array(n).fill(false);
  let i = 0, j = 0;
  while(i < m && j < n){ if(a[i] === b[j]){ ma[i] = mb[j] = true; i++; j++; } else if(dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return { len:dp[0][0], ma, mb };
}
/* Yanlış cevapta: kullanıcının fazla/yanlış kelimelerini ve eksik kelimeleri göster */
function diffHtml(given, answers){
  const g = toks(given); let best = null;
  answers.forEach(a => { const w = toks(a), r = lcsMatch(g, w), score = r.len * 2 - g.length - w.length; if(!best || score > best.score) best = { a, w, r, score }; });
  return {
    ua: g.length ? g.map((t, i) => best.r.ma[i] ? esc(t) : `<del>${esc(t)}</del>`).join(' ') : '<i>(boş)</i>',
    ca: best.w.map((t, i) => best.r.mb[i] ? esc(t) : `<ins>${esc(t)}</ins>`).join(' '),
    a: best.a
  };
}
function startRun(cfg){
  run = Object.assign({ i:0, sonuc:[], xp:0, sayilan:0, ogrenilen:[], prevDone:secDone(cfg.bolum) }, cfg);
  renderRun();
}
function renderRun(){
  const q = run.sorular[run.i], n = run.sorular.length;
  let input;
  if(q.tip === 'secim') input = `<div class="opts ${q.secenekler.some(o => o.length > 22) ? 'three' : ''}" id="ropts">${q.secenekler.map((o, k) => `<button type="button" class="opt" data-v="${esc(o)}"><span class="k">${k + 1}</span>${esc(o)}</button>`).join('')}</div>`;
  else if(q.tip === 'yaz') input = `<form class="typed" id="rtyped" autocomplete="off"><input id="rin" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Cevabını yaz…" aria-label="Cevabın"><button class="btn btn-gold" type="submit">Kontrol et</button></form>`;
  else input = `<div class="order" id="order"><div class="ans" id="oans" aria-label="Cevabın"></div>
      <div class="pool" id="opool">${q.karisik.map(p => `<button type="button" class="chipw">${esc(p)}</button>`).join('')}</div>
      <div class="oacts"><button type="button" class="btn btn-ghost sm" id="oclear">${ic('refresh')} Temizle</button><button type="button" class="btn btn-gold" id="ocheck">Kontrol et</button></div></div>`;
  const tipNote = { secim:`İpucu: Klavyeden 1–${q.secenekler ? q.secenekler.length : 3} ile seçip Enter ile ilerleyebilirsin.`, yaz:'Büyük/küçük harf, nokta ve kesme işareti önemli değil.', sirala:'Parçalara sırayla tıkla. Yanlış yere koyduğun parçaya tekrar tıklarsan geri döner.' }[q.tip];
  const quiz = `
    <div class="quiz">
      <div class="qtop"><span>${esc(run.baslik)}</span><span>Soru <b>${run.i + 1}</b> / ${n}</span></div>
      <div class="bar"><i style="width:${run.i / n * 100}%"></i></div>
      <div class="card qcard">
        <p class="qask">${q.ust}</p>
        <div class="qsent ${q.trSoru ? 'trq' : ''}">${q.soru}</div>
        ${q.ipucu ? `<div class="qhint">${q.ipucu}</div>` : ''}
        ${q.gizliIpucu ? `<div class="qhint"><button type="button" class="linkbtn" id="hintBtn">${ic('info')} İpucu göster</button><span id="hintTxt" hidden>${q.gizliIpucu}</span></div>` : ''}
        ${q.metinGoster ? `<details class="mtxt"><summary>Okuma metnini göster</summary>${readerHtml({ phrases:'none' })}</details>` : ''}
        ${input}
        <div id="rfb"></div>
        <div class="qnav"><button class="btn btn-gold" type="button" id="rnext" hidden>${run.i + 1 < n ? 'Sonraki soru' : 'Sonucu gör'} ${ic('arrow')}</button></div>
      </div>
      <p class="muted" style="text-align:center;font-size:.82rem;margin-top:10px">${tipNote}</p>
    </div>`;
  $('#view').innerHTML = run.yan ? `<div class="split"><aside class="card pad textpanel" id="tpanel">${run.yan()}</aside>${quiz}</div>` : quiz;
  if(run.yan) bindReader($('#tpanel'));
  if(q.metinGoster) bindReader($('details.mtxt'));
  if(q.gizliIpucu) $('#hintBtn').addEventListener('click', () => { $('#hintTxt').hidden = false; $('#hintBtn').hidden = true; });
  if(q.tip === 'secim') $('#ropts').addEventListener('click', e => { const b = e.target.closest('.opt'); if(b && !b.disabled) runAnswer(b.dataset.v); });
  else if(q.tip === 'yaz'){
    $('#rtyped').addEventListener('submit', e => {
      e.preventDefault();
      if(!$('#rin').value.trim()){ shake($('#rin')); return; }
      runAnswer($('#rin').value);
    });
    setTimeout(() => $('#rin').focus(), 30);
  } else {
    const ans = $('#oans'), pool = $('#opool');
    $('#order').addEventListener('click', e => {
      const c = e.target.closest('.chipw'); if(!c || c.disabled) return;
      (c.parentElement === pool ? ans : pool).appendChild(c);
    });
    $('#oclear').addEventListener('click', () => [...ans.children].forEach(c => pool.appendChild(c)));
    $('#ocheck').addEventListener('click', () => {
      if(pool.children.length){ toast('Bütün parçaları kullanmalısın.', 'bad'); shake($('#order')); return; }
      runAnswer([...ans.children].map(c => c.textContent).join(' '));
    });
  }
  $('#rnext').addEventListener('click', () => { run.i++; run.i < run.sorular.length ? renderRun() : finishRun(); });
}
function runAnswer(given){
  const q = run.sorular[run.i], ok = q.dogru.some(d => norm(d) === norm(given)), bec = q.beceri || run.beceri;
  if(q.tip === 'secim') $$('#ropts .opt').forEach(b => { b.disabled = true; if(q.dogru.includes(b.dataset.v)) b.classList.add('good'); else if(b.dataset.v === given) b.classList.add('bad'); });
  else if(q.tip === 'yaz'){ $('#rin').disabled = true; $('#rin').classList.add(ok ? 'good' : 'bad'); $('#rtyped button').disabled = true; }
  else { $$('#order .chipw').forEach(c => c.disabled = true); $('#order').classList.add(ok ? 'good' : 'bad'); $('#oclear').disabled = $('#ocheck').disabled = true; }
  let extra = '';
  if(q.w){
    const r = recordAnswer(q.w, ok, run.bolum, bec);
    if(ok && r.sayildi){ run.xp += 5; run.sayilan++; extra = `"${q.w.en}" öğrenme: ${learnedCount(q.w)}/${LEARN_COUNT} · +5 XP`; if(r.ogrenildi){ run.ogrenilen.push(q.w); extra += ' · Kelime öğrenildi!'; } }
    else if(ok && r.neden === 'bolum') extra = `"${q.w.en}" bu bölümde zaten sayıldı.`;
    else if(ok && r.neden === 'sure') extra = `"${q.w.en}" için son sayılan doğrudan beri 10 dakika geçmedi (${r.kalan} dk kaldı); öğrenmeye sayılmadı.`;
    else if(ok && r.neden === 'zaten') extra = `"${q.w.en}" kelimesini zaten öğrendin.`;
  } else {
    P.beceri[bec].t++; if(ok) P.beceri[bec].d++;
    const ds = dayStat(); ds.t++; if(ok) ds.d++;
    if(ok && !run.prevDone){ run.xp += 3; extra = '+3 XP'; }
  }
  run.sonuc.push({ q, ok, given, bec });
  // Okuma sorularında cevabın geçtiği cümleyi metinde işaretle
  if(q.kanit){
    const box = $('#tpanel') || $('details.mtxt');
    if(box){
      if(box.tagName === 'DETAILS') box.open = true;
      const s = [...box.querySelectorAll('.snt')].find(x => norm(x.textContent).includes(norm(q.kanit)));
      if(s){ s.classList.add('ev'); s.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
    }
  }
  let detail = '';
  if(!ok && q.diff){ const d = diffHtml(given, q.dogru); detail = `<div class="diff">Senin cevabın: ${d.ua}<br>Doğru cevap: ${d.ca}</div>`; }
  else if(!ok && q.tip === 'yaz') detail = `<small>Senin cevabın: ${esc(given)}</small>`;
  const others = ok && q.dogru.length > 1 ? q.dogru.filter(d => norm(d) !== norm(given)).slice(0, 2) : [];
  $('#rfb').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><span class="fi">${ic(ok ? 'check' : 'x')}</span><div>
    <b>${ok ? 'Doğru!' : `Yanlış. Doğru cevap: ${esc(q.dogru[0])}`}</b>
    ${detail}
    ${others.length ? `<small>Bunlar da doğru kabul edilir: ${others.map(esc).join(' · ')}</small>` : ''}
    ${q.kanit ? `<small>Metinde: <i>“${esc(q.kanit)}”</i></small>` : ''}
    ${q.aciklama ? `<small>${esc(q.aciklama)}</small>` : ''}
    ${q.tr && !q.trSoru ? `<small>${q.tam ? `<i>${esc(q.tam)}</i> — ` : ''}${esc(q.tr)}</small>` : ''}
    ${extra ? `<div class="cnt">${esc(extra)}</div>` : ''}</div></div>`;
  if(!ok) $('#rfb .fb').classList.add('shake');
  markStudy(); saveP();
  $('#rnext').hidden = false; $('#rnext').focus();
}
document.addEventListener('keydown', e => {
  if(!run || !$('#ropts') || e.target.tagName === 'INPUT') return;
  if(/^[1-9]$/.test(e.key)){ const b = $$('#ropts .opt')[+e.key - 1]; if(b && !b.disabled) b.click(); }
});
function finishRun(){
  const R = run, n = R.sonuc.length, d = R.sonuc.filter(s => s.ok).length, pct = d / n, passed = pct >= PASS;
  const prev = UD.bolumler[R.bolum] || { tamam:false, enIyi:0, deneme:0 };
  const firstPass = passed && !prev.tamam;
  UD.bolumler[R.bolum] = { tamam: prev.tamam || passed, enIyi: Math.max(prev.enIyi || 0, Math.round(pct * 100)), deneme:(prev.deneme || 0) + 1, t:Date.now() };
  taskProgress('test');
  const extra = R.sonrasi ? R.sonrasi({ passed, firstPass, pct, sonuc:R.sonuc }) || {} : {};
  const bonus = (firstPass ? 20 : 0) + (extra.bonus || 0);
  if(firstPass) log(`${U.ad} · ${R.ad} bölümü tamamlandı`);
  log(`${U.ad} · ${R.ad}: ${d}/${n}`);
  addXp(R.xp + bonus, `${U.ad} · ${R.ad.toLocaleLowerCase('tr')}`);
  saveP();
  const idx = SECTIONS.findIndex(s => s.id === R.bolum), nextI = nextSection(idx);
  const wrongW = R.sonuc.filter(s => !s.ok && s.q.w).map(s => s.q.w).filter((w, i, a) => a.indexOf(w) === i);
  const wrongQ = R.sonuc.filter(s => !s.ok && !s.q.w);
  const inErr = w => P.hataKutuphanesi.some(h => h.en.toLowerCase() === w.en.toLowerCase());
  run = null;
  renderFrame(idx);
  $('#view').innerHTML = `
    <div class="result">
      <div style="display:flex;justify-content:center">${emblem(P.rank, 80, P.tier)}</div>
      <p class="muted" style="margin:.5rem 0 .2rem">${passed ? (firstPass ? 'Bölüm tamamlandı!' : 'Tebrikler, yine geçtin!') : 'Bölümü geçmek için en az %70 gerekiyor.'}</p>
      <div class="score">${d}<small> / ${n}</small></div>
      <div class="rgrid">
        <div><b>%${Math.round(pct * 100)}</b><span>Başarı</span></div>
        <div><b>+${R.xp + bonus}</b><span>XP${bonus ? ` (${bonus} bonus dahil)` : ''}</span></div>
        <div><b>${R.kelimeli ? R.sayilan : d}</b><span>${R.kelimeli ? 'Öğrenmeye sayılan cevap' : 'Doğru cevap'}</span></div>
      </div>
      ${extra.html || ''}
      ${R.ogrenilen.length ? `<p class="pill ok" style="font-size:.85rem">Öğrenilen: ${R.ogrenilen.map(w => esc(w.en)).join(', ')}</p>` : ''}
      ${wrongW.length ? `
        <div class="wrong" id="wrongBox">
          <h3>Zorlandığın kelimeler (${wrongW.length})</h3>
          <p>Bu kelimeleri hata kütüphanene eklemek ister misin?</p>
          <div class="wl" id="wl">${wrongW.map(w => `<label><input type="checkbox" value="${w.id}" ${inErr(w) ? 'disabled' : 'checked'}><b>${esc(w.en)}</b>${inErr(w) ? '<span class="in">zaten hata kütüphanende</span>' : ''}<span class="tr">${esc(w.tr)}</span></label>`).join('')}</div>
          <div class="racts" style="justify-content:flex-start;margin-top:12px">
            <button class="btn btn-gold sm" type="button" id="addErr">${ic('bug')} Seçilenleri ekle</button>
            <button class="btn btn-ghost sm" type="button" id="noErr">Hayır, teşekkürler</button>
          </div>
        </div>` : ''}
      ${wrongQ.length ? `
        <div class="wrong" style="border-color:rgba(240,179,74,.4)">
          <h3>Tekrar gözden geçir (${wrongQ.length})</h3>
          <div class="wl">${wrongQ.map(s => `<label style="cursor:default;flex-wrap:wrap;gap:.3rem .7rem"><span>${s.q.soru}</span><b style="margin-left:auto;color:var(--ok)">${esc(s.q.dogru[0])}</b>${s.q.aciklama ? `<span class="in" style="width:100%">${esc(s.q.aciklama)}</span>` : ''}</label>`).join('')}</div>
        </div>` : ''}
      ${!wrongW.length && !wrongQ.length ? '<p class="pill ok" style="font-size:.85rem;margin-top:8px">Hiç yanlışın yok, harika!</p>' : ''}
      <div class="racts">
        <button class="btn btn-line" type="button" id="again">${ic('refresh')} Tekrar dene</button>
        <button class="btn btn-ghost" type="button" id="toStart">${esc(R.donusAd)}</button>
        ${nextI > -1 ? `<a class="btn btn-gold" href="#${SECTIONS[nextI].id}">Sonraki bölüm: ${SECTIONS[nextI].ad} ${ic('arrow')}</a>` : ''}
      </div>
    </div>`;
  $('#again').addEventListener('click', () => startRun(Object.assign({}, R, { sorular:R.yeniden(), i:0, sonuc:[], xp:0, sayilan:0, ogrenilen:[], prevDone:secDone(R.bolum) })));
  $('#toStart').addEventListener('click', () => VIEWS[R.bolum](SECTIONS[idx]));
  if(extra.after) extra.after();
  if(wrongW.length){
    const box = $('#wrongBox');
    $('#addErr').addEventListener('click', () => {
      const ids = $$('#wl input:checked:not(:disabled)').map(x => x.value);
      if(!ids.length){ toast('Eklemek için en az bir kelime seç.', 'bad'); return; }
      ids.forEach(id => {
        const w = U.kelimeler.find(x => x.id === id);
        P.hataKutuphanesi.push({ id:'h' + rnd(8), en:w.en, tr:w.tr, not:`${U.seviye} · ${U.ad} · ${R.ad.toLocaleLowerCase('tr')}`, t:Date.now() });
        if(!P.bilemedigi.includes(w.en.toLowerCase())) P.bilemedigi.push(w.en.toLowerCase());
      });
      log(`Hata kütüphanesine ${ids.length} kelime eklendi`); saveP();
      box.innerHTML = `<h3>${ic('check')} ${ids.length} kelime hata kütüphanene eklendi</h3><p style="margin:0">Panelindeki <a href="dashboard.html#kutuphane?hata">Hata kütüphanesi</a> bölümünden tekrar edebilirsin.</p>`;
    });
    $('#noErr').addEventListener('click', () => { box.innerHTML = '<p style="margin:0">Tamam, hiçbir kelime eklenmedi. Yanlışların yine de kelime kaydında duruyor.</p>'; });
  }
  window.scrollTo(0, 0);
}

/* ================= Okuma metni (4. ve 5. bölümde ortak) ================= */
const plainOf = s => s.replace(/\[([^|\]]+)\|[^\]]+\]/g, '$1');
function toksHtml(txt){
  return txt.split(/(\s+)/).map(t => {
    if(!t.trim()) return t;
    const m = t.match(/^([^A-Za-z0-9']*)(.*?)([^A-Za-z0-9']*)$/);
    return m[2] ? `${esc(m[1])}<button type="button" class="tok" data-k="${esc(m[2].toLowerCase())}">${esc(m[2])}</button>${esc(m[3])}` : esc(t);
  }).join('');
}
/* phrases: 'found' (yalnızca bulunanlar altın renkli), 'all' (hepsi), 'none' */
function readerHtml(o = {}){
  const R = U.okuma, av = UD.av || [];
  let si = 0;
  const paras = R.paragraflar.map(p => '<p>' + p.split(/(?<=[.!?])\s+/).map(s => `<span class="snt" data-i="${si++}">${
    s.split(/(\[[^\]]+\])/).map(part => {
      const m = part.match(/^\[([^|\]]+)\|([^\]]+)\]$/);
      if(!m) return toksHtml(part);
      const on = o.phrases === 'all' || (o.phrases === 'found' && av.includes(m[2]));
      return `<span class="ph${on ? ' found' : ''}" data-w="${m[2]}">${toksHtml(m[1])}</span>`;
    }).join('')}</span>`).join(' ') + '</p>').join('');
  const words = R.paragraflar.map(plainOf).join(' ').split(/\s+/).length;
  return `<div class="reader"><div class="glossbar" aria-live="polite">Bir kelimeye tıkla, anlamı burada görünsün.</div>
    <h3>${esc(R.baslik)}</h3><div class="by">${U.seviye} · ${esc(U.ad)} · ${words} kelime</div>${paras}</div>`;
}
function bindReader(root, o = {}){
  if(!root) return;
  root.addEventListener('click', e => {
    const t = e.target.closest('.tok'); if(!t || !root.contains(t)) return;
    root.querySelectorAll('.tok.on').forEach(x => x.classList.remove('on')); t.classList.add('on');
    const ph = t.closest('.ph'), bar = root.querySelector('.glossbar');
    let html;
    if(ph){
      const w = U.kelimeler.find(x => x.id === ph.dataset.w);
      html = `<span class="u">${esc(ph.textContent)}</span> → ${esc(w.tr)} <span class="pill gold">ünite ifadesi</span>`;
      if(o.onPhrase) o.onPhrase(ph.dataset.w);
    } else html = `<b>${esc(t.textContent)}</b> → ${esc(U.sozluk[t.dataset.k] || 'Bu kelime sözlükte yok')}`;
    if(bar) bar.innerHTML = html;
  });
}
function translationBox(){

function bindTranslation(){ const b = $('#trToggle'); if(b) b.addEventListener('click', () => { const t = $('#trText'); t.hidden = !t.hidden; b.textContent = t.hidden ? 'Göster' : 'Gizle'; }); }

/* ================= 4. bölüm: Okuma ================= */
function viewOkuma(){
  UD.av = UD.av || [];
  const R = U.okuma, total = U.kelimeler.length, done = secDone('okuma');
  $('#view').innerHTML = `
    <div class="sec-head"><div><h2>${ic('read')} Okuma: ${esc(R.baslik)}</h2><p>Metni oku. Bilmediğin bir kelimeye tıkla, anlamı metnin üstünde görünsün.</p></div>
      <span class="pill ${done ? 'ok' : ''}">${done ? 'Tamamlandı' : 'Okuma metni'}</span></div>
    <div class="split">
      <div class="card pad" id="readBox">${readerHtml({ phrases:'found' })}</div>
      <div>
        <div class="card pad">
          <div class="sec-head" style="margin-bottom:8px"><div><h2 style="font-size:1.02rem">${ic('target')} Kelime avı</h2>
            <p>Türkçeleri aşağıda olan ifadeleri metinde bul ve üzerine tıkla. En az <b>${R.avHedef}</b> tanesini bulunca okuma tamamlanır.</p></div>
            <span class="pill gold" id="huntCount"></span></div>
          <div class="bar"><i id="huntBar"></i></div>
          <div class="hunt" id="huntList"></div>
        </div>
        ${secDone('anlama') ? translationBox() : `<div class="trbox"><div class="lockline">${ic('lock')} Türkçe çeviri, <b style="color:var(--muted)">Anlama</b> sorularını geçince açılır.</div></div>`}
        <div class="toolbar"><span class="muted" id="huntHint"></span><button class="btn btn-gold" id="finishRead" type="button"></button></div>
      </div>
    </div>`;
  function paint(){
    const n = UD.av.length, ready = done || n >= R.avHedef;
    $('#huntCount').textContent = `${n} / ${total}`;
    $('#huntBar').style.width = n / total * 100 + '%';
    $('#huntList').innerHTML = U.kelimeler.map(w => { const f = UD.av.includes(w.id); return `<div class="${f ? 'ok' : ''}"><span>${esc(w.tr)}</span><span>${f ? `<b>${esc(w.en)}</b> ${ic('check')}` : '?'}</span></div>`; }).join('');
    $('#huntHint').textContent = done ? 'Okumayı tamamladın; istersen avı bitirebilirsin.' : ready ? 'Harika! Okumayı tamamlayabilirsin.' : `${R.avHedef - n} ifade daha bul.`;
    const b = $('#finishRead'); b.disabled = !ready;
    b.innerHTML = done ? `Anlama sorularına geç ${ic('arrow')}` : `Okumayı tamamla ${ic('check')}`;
  }
  paint();
  bindReader($('#readBox'), { onPhrase:id => {
    if(UD.av.includes(id)) return;
    UD.av.push(id); markStudy(); saveP();
    $$(`#readBox .ph[data-w="${id}"]`).forEach(x => x.classList.add('found'));
    paint();
    if(UD.av.length === total) toast('Bütün ifadeleri buldun!', 'gold');
  } });
  bindTranslation();
  $('#finishRead').addEventListener('click', () => {
    if(!done){
      const n = UD.av.length;
      UD.bolumler.okuma = { tamam:true, enIyi:Math.round(n / total * 100), deneme:1, t:Date.now() };
      log(`${U.ad} · Okuma bölümü tamamlandı (${n}/${total} ifade bulundu)`);
      taskProgress('okuma');
      addXp(n * 2 + 20, `${U.ad} · okuma ve kelime avı`);
      saveP();
      toast(`Okuma tamamlandı: +${n * 2 + 20} XP`, 'gold');
    }
    location.hash = '#anlama';
  });

}

/* ================= 6. bölüm: Çeviri ================= */
function ceviriQ(c){
  const w = U.kelimeler.find(x => x.id === c.w);
  if(c.tip === 'sirala'){
    let k = shuffle(c.parcalar.slice()), tries = 0;
    while(k.join(' ') === c.parcalar.join(' ') && tries++ < 10) k = shuffle(k);
    return { tip:'sirala', ust:'Kelimeleri doğru sıraya diz.', soru:`“${esc(c.tr)}”`, trSoru:true, karisik:k, dogru:c.dogru, w, beceri:'ceviri', diff:true, aciklama:c.not };
  }
  return { tip:'yaz', ust:'Türkçeden İngilizceye çevir.', soru:`“${esc(c.tr)}”`, trSoru:true, dogru:c.dogru, w, beceri:'ceviri', diff:true, aciklama:c.not,
    gizliIpucu:`Kullanacağın ifade: <b>${esc(w.en)}</b> (${esc(w.tr)})` };
}
function ceviriQs(){
  const all = U.ceviri;
  return [...shuffle(all.filter(c => c.tip === 'yaz')), ...shuffle(all.filter(c => c.tip === 'sirala'))].map(ceviriQ);
}

/* ================= 7. bölüm: Ünite testi ================= */
function blankSent(sentence, part){ return esc(sentence).replace(esc(part), '<span class="blank">&nbsp;</span>'); }
function testQs(){
  const ks = shuffle(U.kelimeler.slice()), qs = [];
  ks.slice(0, 2).forEach(w => qs.push({ tip:'secim', ust:'Kelime · Türkçesi hangisi?', soru:esc(w.en), secenekler:shuffle([w.tr, ...shuffle(U.kelimeler.filter(x => x !== w)).slice(0, 3).map(x => x.tr)]), dogru:[w.tr], w, beceri:'kelime', tam:w.ornek, tr:w.ornekTr }));
  ks.slice(2, 4).forEach(w => { const [d, y] = U.cumleler[w.id]; qs.push({ tip:'secim', ust:'Cümle · Boşluğa hangisi gelmeli?', soru:blankSent(w.ornek, d), secenekler:shuffle([d, ...y]), dogru:[d], w, beceri:'kelime', tam:w.ornek, tr:w.ornekTr }); });
  shuffle(U.dilbilgisi.slice()).slice(0, 2).forEach(g => { const q = grammarQ(g); q.ust = 'Dil bilgisi · ' + q.ust; qs.push(q); });
  shuffle(U.anlama.slice()).slice(0, 2).forEach(a => { const q = anlamaQ(a); q.ust = 'Okuma · ' + q.ust; q.metinGoster = true; qs.push(q); });
  const cv = shuffle(U.ceviri.slice());
  [cv.find(c => c.tip === 'yaz'), cv.find(c => c.tip === 'sirala')].forEach(c => { const q = ceviriQ(c); q.ust = 'Çeviri · ' + q.ust; qs.push(q); });
  return qs;
}
const BECERI_AD = { kelime:'Kelime', dilbilgisi:'Dil bilgisi', okuma:'Okuma', ceviri:'Çeviri' };
const BECERI_BOLUM = { kelime:[['kelime','Kelimeler'],['cumle','Cümleler']], dilbilgisi:[['dilbilgisi','Dil bilgisi']], okuma:[['okuma','Okuma'],['anlama','Anlama']], ceviri:[['ceviri','Çeviri']] };
function testSonrasi(r){
  const by = {};
  r.sonuc.forEach(s => { const b = s.bec; by[b] = by[b] || { d:0, t:0 }; by[b].t++; if(s.ok) by[b].d++; });
  const breakdown = `<div class="rgrid four">${Object.keys(BECERI_AD).filter(k => by[k]).map(k => `<div class="${by[k].d / by[k].t < PASS ? 'weakcell' : ''}"><b>${by[k].d}/${by[k].t}</b><span>${BECERI_AD[k]}</span></div>`).join('')}</div>`;
  if(r.passed){
    const has = P.uniteler.find(u => (u.id || u) === UID), first = !has;
    if(first){ P.uniteler.push({ id:UID, puan:Math.round(r.pct * 100), t:Date.now() }); log(`Ünite tamamlandı: ${U.seviye} · ${U.ad}`); }
    else if(typeof has === 'object') has.puan = Math.max(has.puan || 0, Math.round(r.pct * 100));
    const learned = U.kelimeler.filter(w => learnedCount(w) >= LEARN_COUNT).length;
    return { bonus:first ? 50 : 0, html: breakdown + `
      <div class="unitdone">${emblem(P.rank, 72, P.tier)}
        <h3>${first ? 'Ünite tamamlandı!' : 'Ünite testini yine geçtin!'}</h3>
        <p class="muted" style="margin:.2rem 0">${U.seviye} · ${esc(U.ad)} — 7/7 bölüm${first ? ' · <b style="color:var(--gold2)">+50 XP ünite ödülü</b>' : ''}</p>
        <p class="muted" style="margin:.2rem 0 .9rem">Öğrenilen kelime: <b style="color:var(--gold2)">${learned} / ${U.kelimeler.length}</b>${learned < U.kelimeler.length ? '. Kalan kelimeler, farklı bölümlerde ve farklı zamanlarda tekrar doğru bilinince öğrenilir.' : '. Bütün kelimeleri öğrendin!'}</p>
        <a class="btn btn-gold" href="dashboard.html#ogren">Öğrenme yoluna dön ${ic('arrow')}</a>
      </div>` };
  }
  const weak = Object.keys(by).filter(k => by[k].d / by[k].t < PASS);
  return { html: breakdown + (weak.length ? `<div class="weak"><h3>${ic('alert')} Zorlandığın alanlar</h3><p class="muted" style="margin:0 0 .5rem">Testi tekrar çözmeden önce şu bölümleri gözden geçirmeni öneririz:</p>${weak.map(k => BECERI_BOLUM[k].map(([id, ad]) => `<a class="btn btn-ghost sm" href="#${id}">${ad}</a>`).join('')).join('')}</div>` : '') };
}

/* ================= 2. bölüm: Cümleler ================= */
function tokenize(sentence, phrase){
  // Cümleyi kelimelere böl; ünitenin ifadesini tek parça olarak vurgula
  const i = sentence.toLowerCase().indexOf(phrase.toLowerCase());
  const part = (txt) => txt.split(/(\s+)/).map(t => {
    if(!t.trim()) return t;
    const m = t.match(/^(.*?)([.,!?]*)$/), core = m[1], punct = m[2];
    return `<button type="button" class="tok" data-k="${esc(core.toLowerCase())}">${esc(core)}</button>${punct}`;
  }).join('');
  if(i < 0) return part(sentence);
  return part(sentence.slice(0, i)) + `<button type="button" class="tok hl" data-phrase="1">${esc(sentence.slice(i, i + phrase.length))}</button>` + part(sentence.slice(i + phrase.length));
}

        <div class="gl"></div>
        <div class="tr" hidden>${esc(w.ornekTr)}</div>
      </div>`).join('')}</div>
    <div class="toolbar"><span class="muted">Alıştırmada cümlelerdeki boşlukları dolduracaksın: bazıları şıklı, bazıları yazmalı.</span>
      <button class="btn btn-gold" type="button" id="startC">Alıştırmaya başla ${ic('arrow')}</button></div>`;
  $('#sents').addEventListener('click', e => {
    const t = e.target.closest('.tok'), tr = e.target.closest('[data-tr]');
    if(tr){ const box = tr.closest('.sent').querySelector('.tr'); box.hidden = !box.hidden; tr.textContent = box.hidden ? 'Çeviri' : 'Gizle'; return; }
    if(!t) return;
    const s = t.closest('.sent'), w = U.kelimeler.find(x => x.id === s.dataset.w);
    $$('.tok.on', s).forEach(x => x.classList.remove('on')); t.classList.add('on');
    const mean = t.dataset.phrase ? `${w.en} = ${w.tr}` : (U.sozluk[t.dataset.k] || 'Sözlükte yok');
    s.querySelector('.gl').innerHTML = `<b>${esc(t.textContent)}</b> → ${esc(mean)}`;
  });
  $('#startC').addEventListener('click', () => startRun({ bolum:'cumle', ad:'Cümleler', beceri:'kelime', baslik:'Cümle alıştırması', kelimeli:true, donusAd:'Cümlelere dön', sorular:cumleQs(), yeniden:cumleQs }));
}
function cumleQs(){
  return shuffle(U.kelimeler.slice()).map((w, i) => {
    const [dogru, yanlis, ipucu] = U.cumleler[w.id];
    const blankSent = esc(w.ornek).replace(esc(dogru), '<span class="blank">&nbsp;</span>');
    const base = { w, dogru:[dogru], tam:w.ornek, tr:w.ornekTr, soru:blankSent };
    return i % 2 === 0
      ? Object.assign(base, { tip:'secim', ust:'Boşluğa hangisi gelmeli?', secenekler:shuffle([dogru, ...yanlis]) })
      : Object.assign(base, { tip:'yaz', ust:'Boşluğu doğru biçimde yaz.', ipucu:`İpucu: <b>${esc(ipucu)}</b> · ${esc(w.tr)}` });
  });
}

function grammarQ(q){
  const soru = esc(q.soru).replace('___', '<span class="blank">&nbsp;</span>');
  return q.tip === 'secim'
    ? { tip:'secim', ust:'Doğru seçeneği işaretle.', soru, secenekler:shuffle([q.dogru, ...q.yanlis]), dogru:[q.dogru], aciklama:q.aciklama, tr:q.tr, beceri:'dilbilgisi' }
    : { tip:'yaz', ust:'Boşluğu doğru biçimde yaz.', soru, dogru:q.dogru, aciklama:q.aciklama, tr:q.tr, beceri:'dilbilgisi' };
}
function grammarQs(){
  const all = U.dilbilgisi;
  // Önce şıklılar (karışık sırada), en sonda yazmalılar
  return [...shuffle(all.filter(q => q.tip === 'secim')), ...all.filter(q => q.tip === 'yaz')].map(grammarQ);
}
